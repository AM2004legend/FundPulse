[tool.ruff]
line-length = 100
target-version = "py312"
# Where our own modules live, so imports sort as first-party (dashboard modules and
# tests/fakes.py are imported by their bare names, like Streamlit and pytest do).
src = [".", "dashboard", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting,
# B = common bug patterns, UP = modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets tests do `from pipeline import ...` without installing the project
pythonpath = ["."]
